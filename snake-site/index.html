<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="لعبة ثعبان بتصميم نيون عصري — تلعب مباشرة في المتصفح.">
<meta name="theme-color" content="#06070e">
<style>html{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ثعبان نيون</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen arcade cabinet — HUD rail on top, square neon board filling the middle, control rail below. */
:root{
  --bg:#06070e;
  --bg-2:#0c1020;
  --panel:rgba(136,160,220,.07);
  --line:rgba(140,165,230,.16);
  --fg:#e9edfb;
  --muted:#7d89ad;
  --neon:#5ef2c0;
  --neon-2:#3bb6f5;
  --food:#ff4d8d;
  --violet:#a78bfa;
  --display:"Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;overflow:hidden}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;
  font-family:var(--display);
  color:var(--fg);
  background:
    radial-gradient(90% 70% at 50% 0%,#131b35 0%,transparent 60%),
    radial-gradient(70% 60% at 50% 100%,#10182e 0%,transparent 60%),
    var(--bg);
}
.wrap{
  height:100%;
  display:flex;flex-direction:column;gap:12px;
  padding-inline:16px;padding-block:14px;
  max-width:720px;margin-inline:auto;
}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(140deg,var(--neon),var(--neon-2));
  box-shadow:0 0 18px rgba(94,242,192,.45);
  position:relative;
}
.mark::after{content:"";position:absolute;inset:9px 7px auto auto;width:5px;height:5px;border-radius:50%;background:#06121a}
.brand h1{margin:0;font-size:1.15rem;font-weight:900;letter-spacing:.2px;text-wrap:balance}
.brand small{display:block;font-size:.72rem;color:var(--muted);font-weight:400;letter-spacing:.4px}
.stats{display:flex;gap:8px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:6px 12px;min-width:74px;text-align:center;
}
.stat .lbl{display:block;font-size:.66rem;color:var(--muted);letter-spacing:.8px}
.stat .val{display:block;font-family:var(--mono);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1.35}
#score{color:var(--neon)}
#best{color:var(--violet)}
#speed{color:var(--neon-2)}

/* Board */
.stage{flex:1;min-height:0;display:grid;place-items:center}
.board{
  position:relative;height:100%;aspect-ratio:1/1;max-width:100%;
  border-radius:20px;overflow:hidden;
  border:1px solid var(--line);
  background:linear-gradient(170deg,#0b1024,#070a16 60%,#0a0f20);
  box-shadow:0 0 0 1px rgba(94,242,192,.06),0 24px 70px -30px rgba(59,182,245,.5),inset 0 0 60px rgba(10,16,40,.9);
}
canvas{display:block;width:100%;height:100%}

/* Overlay */
.overlay{
  position:absolute;inset:0;display:grid;place-items:center;padding:20px;
  background:rgba(6,8,16,.72);backdrop-filter:blur(7px);
  text-align:center;z-index:2;
}
.card{max-width:300px;animation:rise .45s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.card .kicker{font-size:.7rem;letter-spacing:2px;color:var(--muted)}
.card h2{margin:.25rem 0 .4rem;font-size:1.7rem;font-weight:900;text-wrap:balance}
.card p{margin:0 0 1rem;color:var(--muted);font-size:.9rem;line-height:1.6}
.card .final{font-family:var(--mono);font-size:2.6rem;font-weight:700;color:var(--neon);line-height:1;margin:.2rem 0 .1rem;font-variant-numeric:tabular-nums}
.btn{
  font-family:var(--display);font-weight:700;font-size:1rem;
  border:0;border-radius:14px;padding:11px 26px;cursor:pointer;color:#04140f;
  background:linear-gradient(140deg,var(--neon),var(--neon-2));
  box-shadow:0 10px 30px -10px rgba(94,242,192,.8);
  transition:transform .14s ease,box-shadow .14s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 36px -12px rgba(94,242,192,.95)}
.btn:active{transform:translateY(0)}
.btn:focus-visible,.pad button:focus-visible{outline:2px solid var(--neon);outline-offset:3px}

/* Controls rail */
.rail{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}
kbd{
  font-family:var(--mono);font-size:.72rem;color:var(--fg);
  background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:7px;padding:2px 7px;
}
.pad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center}
.pad button{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  color:var(--fg);font-size:1.2rem;cursor:pointer;
}
.pad button:active{background:rgba(94,242,192,.18)}
.pad .up{grid-column:2}
.pad .left{grid-column:1;grid-row:2}
.pad .down{grid-column:2;grid-row:2}
.pad .right{grid-column:3;grid-row:2}
@media (pointer:coarse){.pad{display:grid}.rail .keys{display:none}}
@media (max-height:620px){.brand small{display:none}.stat{padding:4px 10px}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.btn{transition:none}}
</style>

</head>
<body>
<div class="wrap" dir="rtl">
  <header class="hud">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>ثعبان نيون</h1>
        <small>كل، إكبر، لا تلمس شيئاً</small>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="lbl">النقاط</span><span class="val" id="score">0</span></div>
      <div class="stat"><span class="lbl">الأفضل</span><span class="val" id="best">0</span></div>
      <div class="stat"><span class="lbl">السرعة</span><span class="val" id="speed">1.0×</span></div>
    </div>
  </header>

  <div class="stage">
    <div class="board">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <div class="card" id="card">
          <div class="kicker" id="kicker">جاهز</div>
          <h2 id="title">هيا نبدأ</h2>
          <p id="desc">حرّك بالأسهم أو <kbd>W A S D</kbd>. كل كرة وردية تطيل الثعبان وتزيد السرعة.</p>
          <button class="btn" id="action">ابدأ اللعب</button>
        </div>
      </div>
    </div>
  </div>

  <div class="pad" id="pad" aria-label="أزرار التحكم">
    <button class="up" data-dir="up" aria-label="أعلى">▲</button>
    <button class="left" data-dir="left" aria-label="يسار">◀</button>
    <button class="down" data-dir="down" aria-label="أسفل">▼</button>
    <button class="right" data-dir="right" aria-label="يمين">▶</button>
  </div>

  <footer class="rail">
    <span class="keys"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> للحركة · <kbd>مسافة</kbd> إيقاف مؤقت · <kbd>R</kbd> إعادة</span>
    <span class="touch" style="display:none">اسحب على اللوح للتحرك</span>
  </footer>
</div>

<script>
(function(){
  "use strict";
  const GRID = 21;
  const BASE_MS = 148, MIN_MS = 68;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  const ov = document.getElementById("overlay");
  const elScore = document.getElementById("score");
  const elBest  = document.getElementById("best");
  const elSpeed = document.getElementById("speed");
  const elKicker= document.getElementById("kicker");
  const elTitle = document.getElementById("title");
  const elDesc  = document.getElementById("desc");
  const elAction= document.getElementById("action");

  let W = 400, cell = W / GRID;
  function resize(){
    const r = cv.getBoundingClientRect();
    if(!r.width) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width  = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    W = r.width; cell = W / GRID;
  }

  // ---- state ----
  let state = "ready";             // ready | playing | paused | over
  let snake, prevSnake, dir, queue, food, score, eaten, grow;
  let tickMs = BASE_MS, lastTick = 0, shake = 0;
  let particles = [], pops = [], ripples = [];
  let best = 0;
  try { best = parseInt(localStorage.getItem("neon-snake-best") || "0", 10) || 0; } catch(e){}
  elBest.textContent = best;

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    prevSnake = snake.map(p => ({x:p.x, y:p.y}));
    dir = {x:1,y:0}; queue = []; grow = 0;
    score = 0; eaten = 0; tickMs = BASE_MS;
    particles = []; pops = []; ripples = []; shake = 0;
    placeFood();
    syncHud();
  }
  function syncHud(){
    elScore.textContent = score;
    elBest.textContent = best;
    elSpeed.textContent = (BASE_MS / tickMs).toFixed(1) + "×";
  }
  function placeFood(){
    const taken = new Set(snake.map(p => p.x + "," + p.y));
    let p, guard = 0;
    do {
      p = { x: (Math.random()*GRID)|0, y: (Math.random()*GRID)|0 };
    } while (taken.has(p.x + "," + p.y) && ++guard < 500);
    food = p; food.born = performance.now();
  }

  // ---- overlays ----
  function showOverlay(kicker, title, desc, btn){
    elKicker.textContent = kicker;
    elTitle.textContent = title;
    elDesc.innerHTML = desc;
    elAction.textContent = btn;
    ov.hidden = false;
  }
  function hideOverlay(){ ov.hidden = true; }

  function start(){
    reset();
    state = "playing";
    lastTick = performance.now();
    hideOverlay();
  }
  function pause(){
    if(state !== "playing") return;
    state = "paused";
    showOverlay("توقف مؤقت", "اللعبة متوقفة", "خذ نفَساً. اضغط للمتابعة من نفس النقطة.", "متابعة");
  }
  function resume(){
    if(state !== "paused") return;
    state = "playing";
    lastTick = performance.now();
    hideOverlay();
  }
  function die(hitX, hitY){
    state = "over";
    shake = reduced ? 0 : 16;
    burst((hitX+0.5)*cell, (hitY+0.5)*cell, 34, ["#ff4d8d","#ff9ec4","#ffffff"], 5.2);
    for(const s of snake) burst((s.x+0.5)*cell, (s.y+0.5)*cell, 4, ["#5ef2c0","#3bb6f5"], 2.6);
    if(score > best){
      best = score;
      try { localStorage.setItem("neon-snake-best", String(best)); } catch(e){}
    }
    syncHud();
    const line = score >= best && score > 0
      ? "رقم قياسي جديد. طوّلت الثعبان أكثر من أي مرة."
      : "أفضل نتيجة لك حتى الآن: <b>" + best + "</b> نقطة.";
    setTimeout(() => {
      if(state === "over"){
        showOverlay("انتهت الجولة", "اصطدمت", line, "جولة جديدة");
        const c = document.getElementById("card");
        const f = document.createElement("div");
        f.className = "final"; f.textContent = score;
        c.insertBefore(f, c.children[2]);
      }
    }, 420);
  }

  elAction.addEventListener("click", () => {
    const f = document.querySelector(".final"); if(f) f.remove();
    if(state === "paused") resume(); else start();
  });

  // ---- input ----
  const DIRS = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
  function push(name){
    const d = DIRS[name]; if(!d) return;
    const last = queue.length ? queue[queue.length-1] : dir;
    if(d.x === -last.x && d.y === -last.y) return;   // no instant reversal
    if(d.x === last.x && d.y === last.y) return;
    if(queue.length < 2) queue.push(d);
  }
  const KEYS = {
    ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
    w:"up", s:"down", a:"left", d:"right",
    W:"up", S:"down", A:"left", D:"right"
  };
  window.addEventListener("keydown", e => {
    if(KEYS[e.key]){
      e.preventDefault();
      if(state === "playing") push(KEYS[e.key]);
      else if(state === "ready") { start(); push(KEYS[e.key]); }
      return;
    }
    if(e.code === "Space"){
      e.preventDefault();
      if(state === "playing") pause();
      else if(state === "paused") resume();
      else start();
    }
    if(e.key === "r" || e.key === "R"){
      const f = document.querySelector(".final"); if(f) f.remove();
      start();
    }
  }, {passive:false});

  document.getElementById("pad").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    if(state === "ready" || state === "over") start();
    push(b.dataset.dir);
  });

  let tx = 0, ty = 0;
  cv.addEventListener("touchstart", e => {
    const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
  }, {passive:true});
  cv.addEventListener("touchend", e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - tx, dy = t.clientY - ty;
    if(Math.hypot(dx,dy) < 24) return;
    if(state === "ready" || state === "over") start();
    push(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right":"left") : (dy > 0 ? "down":"up"));
  }, {passive:true});

  // ---- effects ----
  function burst(x, y, n, colors, speed){
    if(reduced) n = Math.min(n, 6);
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, v = (0.35 + Math.random()) * speed;
      particles.push({
        x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
        life:1, decay:0.012 + Math.random()*0.02,
        r:cell*(0.06 + Math.random()*0.14),
        c:colors[(Math.random()*colors.length)|0]
      });
    }
  }
  function stepFx(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.94; p.vy *= 0.94; p.vy += 0.03*dt;
      p.life -= p.decay*dt;
      if(p.life <= 0) particles.splice(i,1);
    }
    for(let i=pops.length-1;i>=0;i--){
      const t = pops[i]; t.y -= 0.55*dt; t.life -= 0.016*dt;
      if(t.life <= 0) pops.splice(i,1);
    }
    for(let i=ripples.length-1;i>=0;i--){
      const r = ripples[i]; r.r += 0.9*dt; r.life -= 0.022*dt;
      if(r.life <= 0) ripples.splice(i,1);
    }
    if(shake > 0) shake = Math.max(0, shake - 0.5*dt);
  }

  // ---- simulation ----
  function tick(){
    if(queue.length) dir = queue.shift();
    prevSnake = snake.map(p => ({x:p.x, y:p.y}));
    const h = snake[0];
    const nx = h.x + dir.x, ny = h.y + dir.y;

    if(nx < 0 || ny < 0 || nx >= GRID || ny >= GRID){ die(Math.min(GRID-1,Math.max(0,nx)), Math.min(GRID-1,Math.max(0,ny))); return; }
    const limit = grow > 0 ? snake.length : snake.length - 1;
    for(let i=0;i<limit;i++){
      if(snake[i].x === nx && snake[i].y === ny){ die(nx, ny); return; }
    }

    snake.unshift({x:nx, y:ny});
    if(nx === food.x && ny === food.y){
      eaten++; score += 10 + Math.floor(eaten/5)*5;
      grow += 2;
      tickMs = Math.max(MIN_MS, BASE_MS - eaten*3.6);
      const fx = (food.x+0.5)*cell, fy = (food.y+0.5)*cell;
      burst(fx, fy, 22, ["#ff4d8d","#ffa6c8","#a78bfa","#ffffff"], 3.4);
      ripples.push({x:fx, y:fy, r:cell*0.3, life:1});
      pops.push({x:fx, y:fy, life:1, txt:"+" + (10 + Math.floor(eaten/5)*5)});
      placeFood();
      syncHud();
    }
    if(grow > 0) grow--; else snake.pop();
  }

  // ---- rendering ----
  function lerp(a,b,t){ return a + (b-a)*t; }

  function drawBoard(){
    const g = ctx.createLinearGradient(0,0,W,W);
    g.addColorStop(0,"#0b1026"); g.addColorStop(.55,"#070b18"); g.addColorStop(1,"#0a0f22");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,W);

    ctx.fillStyle = "rgba(140,170,240,.075)";
    const r = Math.max(1, cell*0.045);
    for(let y=1;y<GRID;y++) for(let x=1;x<GRID;x++){
      ctx.beginPath(); ctx.arc(x*cell, y*cell, r, 0, 6.2832); ctx.fill();
    }
    const v = ctx.createRadialGradient(W/2,W/2,W*0.3,W/2,W/2,W*0.78);
    v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(2,4,10,.75)");
    ctx.fillStyle = v; ctx.fillRect(0,0,W,W);
  }

  function drawFood(now){
    if(!food) return;
    const x = (food.x+0.5)*cell, y = (food.y+0.5)*cell;
    const pulse = reduced ? 1 : 1 + 0.14*Math.sin(now/170);
    const R = cell*0.30*pulse;

    ctx.save();
    ctx.shadowColor = "#ff4d8d"; ctx.shadowBlur = cell*1.7;
    const g = ctx.createRadialGradient(x - R*0.3, y - R*0.35, R*0.1, x, y, R);
    g.addColorStop(0,"#ffe3ee"); g.addColorStop(.45,"#ff6ba3"); g.addColorStop(1,"#e02f70");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,R,0,6.2832); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x,y);
    if(!reduced) ctx.rotate(now/900);
    ctx.strokeStyle = "rgba(167,139,250,.65)";
    ctx.lineWidth = Math.max(1, cell*0.055);
    ctx.setLineDash([cell*0.22, cell*0.22]);
    ctx.beginPath(); ctx.arc(0,0,cell*0.46,0,6.2832); ctx.stroke();
    ctx.restore();
  }

  function drawSnake(t){
    const pts = [];
    for(let i=0;i<snake.length;i++){
      const a = prevSnake[Math.min(i, prevSnake.length-1)];
      const b = snake[i];
      pts.push({ x:(lerp(a.x,b.x,t)+0.5)*cell, y:(lerp(a.y,b.y,t)+0.5)*cell });
    }
    if(!pts.length) return;

    const head = pts[0], tail = pts[pts.length-1];
    const grad = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
    grad.addColorStop(0,"#c9ffe9");
    grad.addColorStop(.25,"#5ef2c0");
    grad.addColorStop(.7,"#3bb6f5");
    grad.addColorStop(1,"#5b6ff0");

    ctx.lineJoin = "round"; ctx.lineCap = "round";
    const path = () => {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    };

    ctx.save();
    ctx.shadowColor = "rgba(94,242,192,.9)";
    ctx.shadowBlur = cell*1.25;
    ctx.strokeStyle = grad;
    ctx.lineWidth = cell*0.70;
    path(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,.16)";
    ctx.lineWidth = cell*0.24;
    path(); ctx.stroke();
    ctx.restore();

    // head cap + eyes
    ctx.save();
    ctx.shadowColor = "rgba(190,255,235,.95)"; ctx.shadowBlur = cell*1.1;
    ctx.fillStyle = "#d8fff1";
    ctx.beginPath(); ctx.arc(head.x, head.y, cell*0.37, 0, 6.2832); ctx.fill();
    ctx.restore();

    const px = -dir.y, py = dir.x;
    const ex = head.x + dir.x*cell*0.10, ey = head.y + dir.y*cell*0.10;
    const off = cell*0.145, er = cell*0.075;
    ctx.fillStyle = "#061a16";
    ctx.beginPath(); ctx.arc(ex + px*off, ey + py*off, er, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(ex - px*off, ey - py*off, er, 0, 6.2832); ctx.fill();
  }

  function drawFx(){
    for(const r of ripples){
      ctx.save();
      ctx.globalAlpha = Math.max(0, r.life)*0.5;
      ctx.strokeStyle = "#ff8fba";
      ctx.lineWidth = Math.max(1, cell*0.08*r.life);
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.2832); ctx.stroke();
      ctx.restore();
    }
    for(const p of particles){
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.shadowColor = p.c; ctx.shadowBlur = cell*0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    for(const t of pops){
      ctx.save();
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.fillStyle = "#ffd9e8";
      ctx.font = "700 " + (cell*0.75).toFixed(1) + "px JetBrains Mono, monospace";
      ctx.textAlign = "center";
      ctx.shadowColor = "#ff4d8d"; ctx.shadowBlur = cell*0.8;
      ctx.fillText(t.txt, t.x, t.y);
      ctx.restore();
    }
  }

  // ---- loop ----
  let lastFrame = performance.now();
  function frame(now){
    const dt = Math.min(3, (now - lastFrame) / 16.667);
    lastFrame = now;

    if(state === "playing"){
      let guard = 0;
      while(now - lastTick >= tickMs && state === "playing" && guard++ < 5){
        lastTick += tickMs;
        tick();
      }
    } else if(state === "paused"){
      lastTick = now;
    }
    stepFx(dt);

    ctx.setTransform(1,0,0,1,0,0);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,W,W);
    if(shake > 0.1){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }
    drawBoard();
    drawFood(now);
    const t = state === "playing" ? Math.min(1, (now - lastTick) / tickMs) : 1;
    if(state !== "over") drawSnake(t);
    drawFx();

    requestAnimationFrame(frame);
  }

  // ---- boot ----
  function boot(saved){
    resize();
    reset();
    if(saved && typeof saved.best === "number" && saved.best > best){
      best = saved.best;
      try { localStorage.setItem("neon-snake-best", String(best)); } catch(e){}
    }
    syncHud();
    showOverlay("جاهز", "هيا نبدأ",
      'حرّك بالأسهم أو <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>. كل كرة وردية تطيل الثعبان وتزيد السرعة.',
      "ابدأ اللعب");
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(cv);

  try { window.claude?.hot?.snapshot(() => ({ best })); } catch(e){}
  if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot({});
})();
</script>
